[package]
name = "dbear-gpui"
description = "dbear's GPUI frontend: the Linux app (also runs on macOS and Windows for development)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "dbear"
path = "src/main.rs"

[dependencies]
dbcore = { workspace = true, features = ["os-keyring"] }
dbear-update = { path = "../../crates/update" }
# GPUI is pre-1.0: pin exact versions. gpui-kit 0.7.1 pins GPUI itself (gpui-pre 0.3.8).
gpui-kit = "=0.7.1"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
log = "0.4"
# The editor's completion API speaks LSP types; same version and features as gpui-kit's.
lsp-types = { version = "0.97", features = ["proposed"] }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
# Windows resources (icon, version) for dbear.exe; GPUI already uses it for its manifest.
embed-resource = "3"
