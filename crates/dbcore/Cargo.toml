[package]
name = "dbcore"
description = "Shared, UI-free database core used by every dbear frontend (SwiftUI via FFI, GPUI directly)."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros", "net", "sync"] }
async-trait.workspace = true
thiserror.workspace = true
regex.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
mysql_async.workspace = true
rusqlite.workspace = true
tiberius.workspace = true
tokio-util.workspace = true
aes.workspace = true
cbc.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
getrandom.workspace = true
url.workspace = true
percent-encoding.workspace = true
tree-sitter.workspace = true
tree-sitter-sequel.workspace = true
tree-sitter-json.workspace = true
reqwest.workspace = true
base64.workspace = true
flate2.workspace = true
bytes.workspace = true
keyring-core = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { workspace = true, optional = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { workspace = true, optional = true }

[features]
# `secrets::KeyringSecretStore`: Keychain (macOS), Secret Service (Linux), Credential Manager (Windows).
os-keyring = [
    "dep:keyring-core",
    "dep:apple-native-keyring-store",
    "dep:windows-native-keyring-store",
    "dep:zbus-secret-service-keyring-store",
]

[dev-dependencies]
tempfile.workspace = true
