[workspace]
resolver = "2"
members = ["crates/dbcore", "crates/dbcore-ffi", "tools/uniffi-bindgen"]
# Third-party crates patched for dbear (see vendor/README.md): dependencies, not members.
exclude = ["vendor/tiberius"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
dbcore = { path = "crates/dbcore" }
uniffi = "0.32"
tokio = { version = "1", default-features = false }
async-trait = "0.1"
thiserror = "2"
regex = "1"
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = "0.14"
# ring backend: no cmake/NASM needed (aws-lc-rs would need them on Linux)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
webpki-roots = "1"
# MySQL/MariaDB: rustls with the ring provider (no aws-lc / cmake), pure-Rust zlib
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
# SQLite: compiles the bundled amalgamation, no system libsqlite3 needed
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"] }
# Importing DBeaver connections: its credentials file is AES-128-CBC encrypted
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# SQL Server (TDS). Vendored with a small patch: rustls on ring instead of aws-lc-rs, DONE row
# counts on query streams, exact MONEY. See vendor/README.md.
tiberius = { path = "vendor/tiberius", default-features = false, features = ["tds80", "rustls", "sql-browser-tokio"] }
tokio-util = { version = "0.7", default-features = false, features = ["compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
url = "2"
percent-encoding = "2"
tempfile = "3"
# Turso / libSQL over Hrana HTTP. 0.12: its rustls features use ring (0.13 defaults to aws-lc);
# `-no-provider` because the driver passes its own ring-based rustls config.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "http2"] }
base64 = "0.22"
# Dumps: gzip with the pure-Rust miniz_oxide backend (no zlib/cmake); `Bytes` for Postgres COPY FROM
flate2 = "1.1"
bytes = "1"
# SQL syntax highlighting (grammar: github.com/DerekStride/tree-sitter-sql) and JSON for the inspector
tree-sitter = "0.27"
tree-sitter-sequel = "0.3"
tree-sitter-json = "0.24"

[profile.release]
lto = "thin"
